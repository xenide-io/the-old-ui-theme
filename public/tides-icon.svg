<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tides">
  <style>
    .wave-a { animation: drift 3.8s linear infinite; }
    .wave-b { animation: drift 5.4s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-30px); } }
    .drop { animation: bob 2.6s ease-in-out infinite; }
    .drop-2 { animation-delay: 0.45s; }
    .drop-3 { animation-delay: 0.9s; }
    .drop-4 { animation-delay: 1.35s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.8px); } }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: swell 3.6s ease-in-out infinite; }
    .bar-2 { animation-delay: 0.5s; }
    .bar-3 { animation-delay: 1s; }
    @keyframes swell { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.05); } }
    @media (prefers-reduced-motion: reduce) {
      .wave-a, .wave-b, .drop, .bar { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a63bb5" />
      <stop offset="1" stop-color="#7e2180" />
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="4" y="4" width="56" height="56" rx="16" />
    </clipPath>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#tile)" />
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="#5c1760" stroke-opacity="0.55" stroke-width="1.5" />
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" />
  <g clip-path="url(#tile-clip)">
    <rect class="bar" x="14.5" y="18" width="9" height="24" rx="4.5" fill="#57a8f5" />
    <rect class="bar bar-2" x="27.5" y="16" width="9" height="30" rx="4.5" fill="#f2735c" />
    <rect class="bar bar-3" x="40.5" y="20" width="9" height="20" rx="4.5" fill="#f3c24e" />
    <g class="wave-b">
      <path d="M-60 44 q7.5 8 15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0" fill="none" stroke="#bfe3ff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
    </g>
    <g class="wave-a">
      <path d="M-60 40 q7.5 -9 15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
    </g>
    <ellipse cx="32" cy="12" rx="24" ry="9" fill="#ffffff" opacity="0.08" />
  </g>
  <circle class="drop" cx="10.5" cy="28.5" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle class="drop drop-2" cx="17" cy="24" r="1.1" fill="#ffffff" opacity="0.75" />
  <circle class="drop drop-3" cx="48.5" cy="26" r="1.3" fill="#ffffff" opacity="0.85" />
  <circle class="drop drop-4" cx="55" cy="31" r="1" fill="#ffffff" opacity="0.7" />
</svg>
